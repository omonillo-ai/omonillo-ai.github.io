<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omonillo Ziyo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: same as Business Academy Preview — navy page, gold glow, two-line heavy headline beside a cut-out photo, steel 3D cards with icon · text · arrow */
:root{
  --navy:#0B1C2E; --navy-2:#102a44; --steel-a:#DCE4EC; --steel-b:#B9C6D3;
  --ink:#102239; --white:#F5F7FA; --muted:#A9B8C8; --gold:#C6A36A; --gold-hi:#EBCF94;
  --font:Inter,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--navy);color:var(--white)}
body{font-family:var(--font);font-size:15px;line-height:1.5;margin:0;position:relative;overflow-x:hidden}
.glow{position:absolute;inset:0 0 auto 0;height:620px;pointer-events:none;
  background:radial-gradient(ellipse at 78% 18%,rgba(198,163,106,.45),transparent 38%),
             radial-gradient(ellipse at 90% 40%,rgba(120,150,190,.25),transparent 45%),
             linear-gradient(180deg,rgba(11,28,46,.55),var(--navy) 95%)}
.wrap{position:relative;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}

.hero{display:grid;container-type:inline-size;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);
  grid-template-areas:"e e" "a a" "b p" "s p";column-gap:12px;row-gap:10px;align-items:start}
.eyebrow{grid-area:e;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hl{font-size:clamp(30px,13cqw,64px);line-height:1.04;letter-spacing:-.01em;font-weight:900;margin:0;min-width:0;text-wrap:balance}
.hl1{grid-area:a}.hl2{grid-area:b}
.gold-t{background:linear-gradient(90deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{grid-area:s;color:var(--muted);margin:0;min-width:0}
.hero-ph{grid-area:p;align-self:start;aspect-ratio:1;width:100%;max-width:100%;margin-top:-30%}
.hero-ph img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block}

.list{display:flex;flex-direction:column;gap:14px}
.item{display:flex;flex-direction:column}
.card{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;
  background:linear-gradient(145deg,var(--steel-a),var(--steel-b));color:var(--ink);border-radius:22px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 0 0 1px rgba(160,200,255,.35),0 0 16px rgba(110,160,230,.28),0 14px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 6px rgba(16,34,57,.15);
  transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 20px 34px rgba(0,0,0,.55),inset 0 1px 0 #fff;outline:2px solid var(--gold)}
.ic{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#1c3752,#07131f);box-shadow:0 6px 12px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.25)}
svg.i{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.t{font-weight:900;font-size:16px;line-height:1.2;text-wrap:balance}
.s{font-size:13px;color:#3a5470;margin-top:3px}
.sep{align-self:stretch;width:1px;background:rgba(16,34,57,.3)}
.arr{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#cfd8e2);box-shadow:0 6px 12px rgba(0,0,0,.3),inset 0 -2px 4px rgba(16,34,57,.15);transition:transform .25s}
.arr svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.item.open .arr{transform:rotate(90deg)}
.more{margin:8px 6px 0;padding:14px 16px;border-radius:16px;background:var(--navy-2);border:1px solid rgba(198,163,106,.35)}
.more p{margin:0 0 10px;color:#d9e1ea}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(198,163,106,.5);color:var(--gold-hi)}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;
  padding:9px 16px;border-radius:999px;background:linear-gradient(90deg,var(--gold-hi),var(--gold));color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--white);outline-offset:2px}

.contact{padding:18px;border-radius:22px;background:var(--navy-2);border:1px solid rgba(198,163,106,.4);display:flex;flex-direction:column;gap:12px}
.contact h2{font-weight:900;font-size:18px;margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.row .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row .v{font-size:17px;font-weight:700;user-select:all;font-variant-numeric:tabular-nums}
.ghost{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-hi)}
.ghost:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:8px}
footer{text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card,.arr{transition:none}}
</style>

</head>

<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">Ўзган · Қирғизистон</div>
